<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ajay Kawa – Projects Update</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='black'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EAK%3C/text%3E%3C/svg%3E">
<style>
:root{
  --black:#000; --navy:#0F1B2D; --navy-2:#18263B; --red:#DC051E; --ink:#1D2433; --slate:#5B6472;
  --rule:#E2E5EA; --wash:#F4F6F8; --paper:#FFFFFF; --fill-bg:#FDECEE; --ok:#1E7B4F;
  --font:Aptos,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit}
a{color:var(--navy)}
:focus-visible{outline:3px solid #8AB4F8;outline-offset:2px}
.hidden{display:none!important}

/* sign-in */
#login{min-height:100vh;background:var(--black);color:#fff;display:grid;place-items:center;padding:24px}
.loginbox{width:100%;max-width:380px}
.loginbox h1{font-size:30px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.loginbox .sub{color:#8C8C8C;margin:0 0 36px;font-size:15px}
.loginbox label{display:block;font-size:14px;color:#A6A6A6;margin:16px 0 6px}
.loginbox select,.loginbox input{width:100%;padding:12px 14px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
.loginbox select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.loginbox .go{width:100%;margin-top:24px;padding:12px;border:0;border-radius:6px;background:#fff;color:#000;font-weight:700;cursor:pointer}
.loginbox .go[disabled]{opacity:.6;cursor:wait}
.loginmsg{min-height:22px;margin-top:14px;font-size:14px;color:#FF8A8A}

.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.quiet{background:var(--paper);color:var(--navy);border:1px solid var(--rule)}
.btn.small{padding:6px 11px;font-size:14px}

/* app */
#app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
#side{background:var(--black);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 0 30px}
.brand{padding:0 22px 20px;border-bottom:1px solid #222}
.brand b{display:block;font-size:17px}
.brand span{font-size:13px;color:#8C8C8C}
nav h4{margin:22px 22px 6px;font-size:13px;font-weight:600;color:#777}
nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 22px;color:#D9D9D9;text-decoration:none;font-size:15px;border-left:3px solid transparent}
nav a:hover{background:#141414;color:#fff}
nav a.on{background:#1A1A1A;color:#fff;border-left-color:#fff}
nav a .cnt{font-size:12px;color:#FF8A8A;white-space:nowrap}
nav a .cnt.plain{color:#8C8C8C}
.sidefoot{padding:22px;font-size:13px;color:#8C8C8C}
.sidefoot .btn{margin-top:10px;background:#1A1A1A;border:1px solid #333}

main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:34px 48px 18px;border-bottom:1px solid var(--rule)}
.top h1{margin:0;font-size:32px;line-height:1.2;color:var(--navy)}
.top .meta{margin-top:6px;color:var(--slate);font-size:14px}
.top .tools{display:flex;gap:8px;flex-wrap:wrap}
article{padding:26px 48px 80px;max-width:1000px}
article h2{font-size:22px;color:var(--navy);margin:34px 0 10px;line-height:1.3}
article h3{font-size:18px;color:var(--navy);margin:24px 0 8px}
article p,article li{max-width:75ch}
article ul,article ol{padding-left:22px}
article li{margin:4px 0}
article li.sub{margin-left:20px;list-style:circle}
#body.editing{outline:2px dashed var(--red);outline-offset:10px;border-radius:2px}
.note{border-left:3px solid var(--red);padding:4px 0 4px 14px;color:var(--slate);font-style:italic}
mark{background:var(--fill-bg);color:var(--red);font-weight:600;padding:0 3px;border-radius:3px}
.tw{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--wash);color:var(--navy);text-align:left;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top}
tbody tr:first-child td{border-top:0}

.docs{margin-top:40px;padding-top:6px;border-top:2px solid var(--navy)}
.docrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.docrow .n{font-weight:600;word-break:break-word}
.docrow .d{font-size:13px;color:var(--slate)}
.docrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--slate);padding:12px 0}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.filter select,.filter input{padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff}

.panel{border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin:18px 0}
.panel h3{margin-top:0}
.field{margin:10px 0}
.field label{display:block;font-size:14px;color:var(--slate);margin-bottom:4px}
.field input,.field select{width:100%;max-width:520px;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.status{font-size:14px;margin-top:10px;white-space:pre-line}
.status.err{color:var(--red)} .status.ok{color:var(--ok)}

#menuBtn{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:290px;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  #side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  #menuBtn{display:inline-block;margin-bottom:10px}
  .top{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 14px;flex-direction:column}
  .top h1{font-size:26px}
  article{padding:18px 18px 60px}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
@media print{#side,.top .tools,.docs .acts,#menuBtn{display:none}#app{display:block}article{max-width:none}}
</style>
</head>
<body>

<section id="login">
  <form class="loginbox" id="loginForm" autocomplete="off">
    <h1>Ajay Kawa Projects Update</h1>
    <p class="sub">Confidential information</p>
    <label for="user">User</label>
    <select id="user"></select>
    <label for="pw">Password</label>
    <input id="pw" type="password" required autocomplete="current-password">
    <button class="go" type="submit">Sign in</button>
    <div class="loginmsg" id="loginMsg" role="status"></div>
  </form>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><b>Projects Update</b><span id="sideMeta"></span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="sidefoot"><div id="whoami"></div><button class="btn small" id="outBtn" type="button">Sign out</button></div>
  </aside>
  <main>
    <div class="top">
      <div>
        <button class="btn quiet small" id="menuBtn" type="button" aria-controls="side">Sections</button>
        <h1 id="secTitle"></h1>
        <div class="meta" id="secMeta"></div>
      </div>
      <div class="tools">
        <button class="btn small hidden" id="editBtn" type="button">Edit this page</button>
        <button class="btn quiet small hidden" id="cancelBtn" type="button">Cancel</button>
        <button class="btn quiet small" type="button" onclick="window.print()">Print this page</button>
      </div>
    </div>
    <article id="view"></article>
  </main>
</div>

<script type="module">
/* =====================================================================
   SETTINGS – paste your Firebase web-app config here
   (Firebase console → Project settings → Your apps → Web app → Config)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCTxB6ra77vXbdaWuGPPEKWo2bdPB2HrPc",
  authDomain: "ajaykawa-32558.firebaseapp.com",
  projectId: "ajaykawa-32558",
  storageBucket: "ajaykawa-32558.firebasestorage.app",
  messagingSenderId: "675368452328",
  appId: "1:675368452328:web:5e5e1215b405496177095d"
};
/* The two people who can sign in. Emails must match the users created in
   Firebase Authentication and the list in the Firestore rules. */
const USERS = [
  { name: 'Ajay Kawa', email: 'aj@ykawa.com' },
  { name: 'Raj Kumar', email: 'raj@rajkumar.com' }
];
/* ===================================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, setPersistence, browserSessionPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, Bytes }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fmtSize = n => n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB';
const fmtDate = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
const today = () => new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const CHUNK = 900 * 1024;
const EXTRA_SECTIONS = [['other','Other documents']];

$('user').innerHTML = USERS.map(u => `<option value="${esc(u.email)}">${esc(u.name)}</option>`).join('');

const notConfigured = FIREBASE_CONFIG.apiKey.startsWith('PASTE');
if (notConfigured) $('loginMsg').textContent = 'This site is not connected to Firebase yet. Paste the Firebase config into index.html.';
const app = notConfigured ? null : initializeApp(FIREBASE_CONFIG);
const auth = app && getAuth(app);
const db = app && getFirestore(app);
if (auth) setPersistence(auth, browserSessionPersistence).catch(() => {});

const S = { me: null, meta: {}, sections: [], docs: [] };
let current = 'start';

function friendly(err){
  const c = err && err.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Password not recognised for this user.';
  if (c.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if (c.includes('network')) return 'No connection. Check your internet and try again.';
  if (c.includes('permission-denied')) return 'This account is not allowed to open the update. Check the Firestore rules list this email.';
  if (c.includes('requires-recent-login')) return 'For security, sign out and back in, then change your password.';
  if (c.includes('weak-password')) return 'Choose a password of at least 6 characters.';
  return (err && err.message) || 'Something went wrong.';
}

/* ---------- sign in ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); if (!auth) return;
  const btn = $('loginForm').querySelector('button'); btn.disabled = true; $('loginMsg').textContent = 'Signing in…';
  try { await signInWithEmailAndPassword(auth, $('user').value, $('pw').value); $('pw').value = ''; }
  catch(err){ $('loginMsg').textContent = friendly(err); }
  btn.disabled = false;
};
$('outBtn').onclick = () => signOut(auth);
if (auth) onAuthStateChanged(auth, async user => {
  if (!user){ S.me = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('view').innerHTML = ''; return; }
  S.me = USERS.find(u => u.email.toLowerCase() === (user.email||'').toLowerCase()) || { name: user.email, email: user.email };
  $('loginMsg').textContent = 'Loading…';
  try { await loadAll(); $('loginMsg').textContent = ''; openApp(); }
  catch(err){ $('loginMsg').textContent = friendly(err); await signOut(auth); }
});

/* ---------- data ---------- */
async function loadAll(){
  const m = await getDoc(doc(db, 'meta', 'site')); S.meta = m.exists() ? m.data() : {};
  const sec = await getDocs(collection(db, 'sections'));
  S.sections = sec.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.order ?? 99) - (b.order ?? 99));
  const dd = await getDocs(collection(db, 'docs'));
  S.docs = dd.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function saveFile(name, type, bytes, section, note, progress){
  const ref = doc(collection(db, 'docs')); const n = Math.max(1, Math.ceil(bytes.length / CHUNK));
  for (let i = 0; i < n; i++){
    progress && progress(`Uploading ${name} – part ${i+1} of ${n}…`);
    await setDoc(doc(db, 'docs', ref.id, 'chunks', String(i).padStart(4,'0')), { d: Bytes.fromUint8Array(bytes.subarray(i*CHUNK, (i+1)*CHUNK)) });
  }
  const meta = { name, type: type || 'application/octet-stream', size: bytes.length, section, note: note || '', uploaded: new Date().toISOString(), by: S.me.name, chunks: n };
  await setDoc(ref, meta);  // written last, so half-finished uploads never appear in the list
  S.docs.push({ id: ref.id, ...meta });
}
async function readFile(d){
  const snap = await getDocs(collection(db, 'docs', d.id, 'chunks'));
  const parts = snap.docs.sort((a,b) => a.id.localeCompare(b.id)).map(x => x.data().d.toUint8Array());
  return new Blob(parts, { type: d.type });
}
async function removeFile(d){
  const snap = await getDocs(collection(db, 'docs', d.id, 'chunks'));
  for (const c of snap.docs) await deleteDoc(doc(db, 'docs', d.id, 'chunks', c.id));
  await deleteDoc(doc(db, 'docs', d.id));
  S.docs = S.docs.filter(x => x.id !== d.id);
}
async function importContent(data, msg){
  if (!Array.isArray(data.sections)) throw new Error('That file is not a handover content file.');
  for (let i = 0; i < data.sections.length; i++){
    const s = data.sections[i]; msg(`Saving section ${i+1} of ${data.sections.length}…`);
    await setDoc(doc(db, 'sections', s.id), { title: s.title, group: s.group, order: i, html: s.html, updatedAt: new Date().toISOString(), updatedBy: S.me.name });
  }
  await setDoc(doc(db, 'meta', 'site'), { updated: data.updated || today(), preparedBy: data.preparedBy || 'Ajay Kawa', preparedFor: data.preparedFor || 'Raj Kumar' });
  for (const a of (data.attachments || [])){
    const old = S.docs.find(d => d.name === a.name && d.section === a.section);
    if (old){ msg('Replacing ' + a.name + '…'); await removeFile(old); }
    await saveFile(a.name, a.type, unb64(a.data), a.section, 'Handover document', msg);
  }
  await loadAll();
}

/* ---------- layout ---------- */
function allSections(){ return [...S.sections, { id:'documents', title:'All documents', group:'Files' }, { id:'admin', title:'Upload & settings', group:'Files' }]; }
function fillCount(html){ return (String(html||'').match(/<mark>/g) || []).length; }
function openApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('sideMeta').textContent = S.meta.updated ? 'Updated ' + S.meta.updated : 'Confidential';
  $('whoami').textContent = 'Signed in as ' + S.me.name;
  renderNav();
  const want = location.hash.slice(1);
  go(want || (S.sections.length ? S.sections[0].id : 'admin'));
}
function renderNav(){
  const groups = {};
  for (const s of allSections()) (groups[s.group || 'Sections'] = groups[s.group || 'Sections'] || []).push(s);
  $('nav').innerHTML = Object.entries(groups).map(([g, items]) => `<h4>${esc(g)}</h4>` + items.map(s => {
    const n = fillCount(s.html);
    const tag = s.id === 'documents' ? `<span class="cnt plain">${S.docs.length}</span>` : n ? `<span class="cnt" title="Items still to fill in">${n} to fill</span>` : '';
    return `<a href="#${s.id}" data-id="${s.id}">${esc(s.title)}${tag}</a>`;
  }).join('')).join('');
}
window.addEventListener('hashchange', () => { if (S.me) go(location.hash.slice(1)); });
$('menuBtn').onclick = () => $('side').classList.toggle('open');
$('nav').addEventListener('click', () => $('side').classList.remove('open'));

function go(id){
  const all = allSections(); const s = all.find(x => x.id === id) || all[0]; current = s.id;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === s.id));
  $('secTitle').textContent = s.title;
  const n = fillCount(s.html);
  $('secMeta').textContent = s.id === 'documents' ? 'Every file uploaded to the update' : s.id === 'admin' ? 'Upload files, load content and change your password'
    : `Prepared by ${S.meta.preparedBy || 'Ajay Kawa'} for ${S.meta.preparedFor || 'Raj Kumar'}` + (s.updatedAt ? ` · last edited ${fmtDate(s.updatedAt)}${s.updatedBy ? ' by ' + s.updatedBy : ''}` : '') + (n ? ` · ${n} item${n>1?'s':''} still to fill in` : '');
  if (s.id === 'documents') renderAllDocs();
  else if (s.id === 'admin') renderAdmin();
  else { $('view').innerHTML = '<div id="body">' + s.html + '</div>' + docsBlock(s.id); bindDocButtons(); }
  const editable = S.sections.some(x => x.id === s.id);
  $('editBtn').classList.toggle('hidden', !editable); $('editBtn').textContent = 'Edit this page'; $('cancelBtn').classList.add('hidden');
  window.scrollTo(0,0); document.title = s.title + ' – Projects Update';
}

/* ---------- editing ---------- */
$('editBtn').onclick = async () => {
  const body = $('body'); if (!body) return;
  if (body.contentEditable !== 'true'){
    body.contentEditable = 'true'; body.classList.add('editing'); body.focus();
    $('editBtn').textContent = 'Save changes'; $('cancelBtn').classList.remove('hidden');
    $('secMeta').textContent = 'Editing – click into any text or table cell and type over the red items, then save.';
    return;
  }
  body.querySelectorAll('mark').forEach(m => { if (!/^\s*\[/.test(m.textContent)) m.replaceWith(...m.childNodes); });
  const sec = S.sections.find(x => x.id === current);
  $('editBtn').disabled = true; $('editBtn').textContent = 'Saving…';
  try {
    const upd = { html: body.innerHTML, updatedAt: new Date().toISOString(), updatedBy: S.me.name };
    await setDoc(doc(db, 'sections', sec.id), upd, { merge: true }); Object.assign(sec, upd);
    await setDoc(doc(db, 'meta', 'site'), { updated: today() }, { merge: true }); S.meta.updated = today();
    renderNav(); go(current);
  } catch(err){ alert(friendly(err) + ' Your edits are still on screen – try saving again.'); $('editBtn').textContent = 'Save changes'; }
  $('editBtn').disabled = false;
};
$('cancelBtn').onclick = () => go(current);

/* ---------- documents ---------- */
function sectionTitle(id){ const s = allSections().find(x => x.id === id); return s ? s.title : (EXTRA_SECTIONS.find(x => x[0] === id) || [,id])[1]; }
function docRow(d, showSection){
  const canView = /pdf|image|text/.test(d.type);
  return `<div class="docrow"><div><div class="n">${esc(d.name)}</div><div class="d">${fmtSize(d.size)} · added ${fmtDate(d.uploaded)}${d.by ? ' by ' + esc(d.by) : ''}${showSection ? ' · ' + esc(sectionTitle(d.section)) : ''}${d.note ? ' · ' + esc(d.note) : ''}</div></div>
    <div class="acts">${canView ? `<button class="btn quiet small" data-act="view" data-id="${d.id}">View</button>` : ''}<button class="btn small" data-act="dl" data-id="${d.id}">Download</button><button class="btn quiet small" data-act="del" data-id="${d.id}">Delete</button></div></div>`;
}
function docsBlock(sec){
  const docs = S.docs.filter(d => d.section === sec).sort((a,b) => a.name.localeCompare(b.name));
  return `<section class="docs"><h2>Documents</h2>${docs.length ? docs.map(d => docRow(d)).join('') : '<p class="empty">No documents in this section yet. Add them from Upload &amp; settings.</p>'}</section>`;
}
function renderAllDocs(){
  const opts = [...new Set(S.docs.map(d => d.section))];
  $('view').innerHTML = `<div class="filter"><input id="q" type="search" placeholder="Search file names" aria-label="Search file names">
    <select id="fs" aria-label="Filter by section"><option value="">All sections</option>${opts.map(o => `<option value="${esc(o)}">${esc(sectionTitle(o))}</option>`).join('')}</select></div><div id="list"></div>`;
  const draw = () => { const q = $('q').value.toLowerCase(), f = $('fs').value;
    const docs = S.docs.filter(d => (!f || d.section === f) && (!q || d.name.toLowerCase().includes(q))).sort((a,b) => String(b.uploaded).localeCompare(String(a.uploaded)));
    $('list').innerHTML = docs.length ? docs.map(d => docRow(d, true)).join('') : '<p class="empty">No documents match.</p>'; bindDocButtons(); };
  $('q').oninput = draw; $('fs').onchange = draw; draw();
}
function bindDocButtons(){
  $('view').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const d = S.docs.find(x => x.id === b.dataset.id); if (!d) return;
    const label = b.textContent; b.disabled = true;
    try {
      if (b.dataset.act === 'del'){
        if (!confirm('Delete ' + d.name + '? This cannot be undone.')) { b.disabled = false; return; }
        b.textContent = 'Deleting…'; await removeFile(d); renderNav(); go(current); return;
      }
      b.textContent = 'Opening…';
      const url = URL.createObjectURL(await readFile(d));
      if (b.dataset.act === 'view') window.open(url, '_blank', 'noopener');
      else { const a = document.createElement('a'); a.href = url; a.download = d.name; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch(err){ alert(friendly(err)); }
    b.textContent = label; b.disabled = false;
  });
}

/* ---------- upload & settings ---------- */
function renderAdmin(){
  const secOpts = [...S.sections.map(s => [s.id, s.title]), ...EXTRA_SECTIONS];
  $('view').innerHTML = `
  ${S.sections.length ? '' : `<div class="panel"><h3>Get started</h3><p>The update has no content yet. Load <strong>handover-content.json</strong> below to create all the sections and the first documents.</p></div>`}
  <div class="panel"><h3>Upload documents</h3>
    <p>Choose the section, then one or more files. GitHub zips go in “GitHub files”. Large files upload in parts – keep this page open until it says done.</p>
    <div class="field"><label for="upSec">Section</label><select id="upSec">${secOpts.map(([v,t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></div>
    <div class="field"><label for="upFiles">Files</label><input id="upFiles" type="file" multiple></div>
    <div class="field"><label for="upNote">Note (optional)</label><input id="upNote" placeholder="e.g. Signed copy, 1 Aug 2026"></div>
    <button class="btn" id="upBtn" type="button">Upload</button><div class="status" id="upMsg" role="status"></div></div>

  <div class="panel"><h3>Load or update handover content</h3>
    <p>Choose a handover-content.json file. Sections are created or replaced; documents you uploaded yourself are kept.</p>
    <div class="field"><input id="cFile" type="file" accept=".json,application/json"></div>
    <button class="btn quiet" id="cBtn" type="button">Load content</button><div class="status" id="cMsg" role="status"></div></div>

  <div class="panel"><h3>Change my password</h3>
    <div class="field"><label for="np">New password (at least 6 characters)</label><input id="np" type="password" autocomplete="new-password"></div>
    <button class="btn quiet" id="npBtn" type="button">Change password</button><div class="status" id="npMsg" role="status"></div></div>`;
  if (S.sections.some(s => s.id === current)) $('upSec').value = current;
  $('upBtn').onclick = async () => {
    const files = [...$('upFiles').files]; const out = $('upMsg'); out.className = 'status';
    if (!files.length){ out.textContent = 'Choose at least one file.'; out.classList.add('err'); return; }
    const big = files.find(f => f.size > 200 * 1048576); if (big){ out.textContent = big.name + ' is over 200 MB. Put it in the Google Drive folder instead.'; out.classList.add('err'); return; }
    $('upBtn').disabled = true;
    try {
      for (const f of files) await saveFile(f.name, f.type, new Uint8Array(await f.arrayBuffer()), $('upSec').value, $('upNote').value.trim(), t => out.textContent = t);
      out.textContent = `${files.length} file${files.length > 1 ? 's' : ''} uploaded to ${sectionTitle($('upSec').value)}.`; out.classList.add('ok');
      $('upFiles').value = ''; $('upNote').value = ''; renderNav();
    } catch(err){ out.textContent = friendly(err); out.classList.add('err'); }
    $('upBtn').disabled = false;
  };
  $('cBtn').onclick = async () => {
    const out = $('cMsg'); out.className = 'status'; const f = $('cFile').files[0];
    if (!f){ out.textContent = 'Choose the handover-content.json file.'; out.classList.add('err'); return; }
    $('cBtn').disabled = true;
    try { await importContent(JSON.parse(await f.text()), t => out.textContent = t);
      $('sideMeta').textContent = 'Updated ' + S.meta.updated; renderNav(); renderAdmin();
      $('cMsg').textContent = 'Content loaded – open any section from the menu.'; $('cMsg').className = 'status ok';
    } catch(err){ out.textContent = friendly(err); out.classList.add('err'); }
    $('cBtn').disabled = false;
  };
  $('npBtn').onclick = async () => {
    const out = $('npMsg'); out.className = 'status'; const p = $('np').value;
    if (p.length < 6){ out.textContent = 'Use at least 6 characters.'; out.classList.add('err'); return; }
    try { await updatePassword(auth.currentUser, p); out.textContent = 'Password changed.'; out.classList.add('ok'); $('np').value = ''; }
    catch(err){ out.textContent = friendly(err); out.classList.add('err'); }
  };
}
</script>
</body>
</html>
