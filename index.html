<html lang="en-GB">

<style>
:root{
  --black:#000; --navy:#0F1B2D; --navy-2:#18263B; --red:#DC051E; --ink:#1D2433; --slate:#5B6472;
  --rule:#E2E5EA; --wash:#F4F6F8; --paper:#FFFFFF; --fill-bg:#FDECEE; --ok:#1E7B4F;
  --font:Aptos,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit}
a{color:var(--navy)}
:focus-visible{outline:3px solid #8AB4F8;outline-offset:2px}
.hidden{display:none!important}

/* sign-in */
#login{min-height:100vh;background:var(--black);color:#fff;display:grid;place-items:center;padding:24px}
.loginbox{width:100%;max-width:380px}
.loginbox h1{font-size:30px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.loginbox .sub{color:#8C8C8C;margin:0 0 36px;font-size:15px}
.loginbox label{display:block;font-size:14px;color:#A6A6A6;margin:16px 0 6px}
.loginbox select,.loginbox input{width:100%;padding:12px 14px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
.loginbox select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.loginbox .go{width:100%;margin-top:24px;padding:12px;border:0;border-radius:6px;background:#fff;color:#000;font-weight:700;cursor:pointer}
.loginbox .go[disabled]{opacity:.6;cursor:wait}
.loginmsg{min-height:22px;margin-top:14px;font-size:14px;color:#FF8A8A}

.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.quiet{background:var(--paper);color:var(--navy);border:1px solid var(--rule)}
.btn.small{padding:6px 11px;font-size:14px}

/* app */
#app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
#side{background:var(--black);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 0 30px}
.brand{padding:0 22px 20px;border-bottom:1px solid #222}
.brand b{display:block;font-size:17px}
.brand span{font-size:13px;color:#8C8C8C}
nav .gh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:#fff;font-weight:700;font-size:15px;text-align:left;padding:12px 22px 6px;cursor:pointer}
nav .gh .chev{color:#777;font-size:12px;transition:transform .15s}
nav .gh[aria-expanded="true"] .chev{transform:rotate(90deg)}
nav .gh .gc{font-size:12px;color:#FF8A8A;font-weight:400;margin-left:auto;margin-right:10px}
nav .items{padding-bottom:6px}
nav .items a{padding-left:34px;font-size:14.5px}
nav .grp{border-bottom:1px solid #1A1A1A}
nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 22px;color:#D9D9D9;text-decoration:none;font-size:15px;border-left:3px solid transparent}
nav a:hover{background:#141414;color:#fff}
nav a.on{background:#1A1A1A;color:#fff;border-left-color:#fff}
nav a .cnt{font-size:12px;color:#FF8A8A;white-space:nowrap}
nav a .cnt.plain{color:#8C8C8C}
.sidefoot{padding:22px;font-size:13px;color:#8C8C8C}
.sidefoot .btn{margin-top:10px;background:#1A1A1A;border:1px solid #333}

main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:34px 48px 18px;border-bottom:1px solid var(--rule)}
.top h1{margin:0;font-size:32px;line-height:1.2;color:var(--navy)}
.top .meta{margin-top:6px;color:var(--slate);font-size:14px}
.top .tools{display:flex;gap:8px;flex-wrap:wrap}
article{padding:26px 48px 80px;max-width:1000px}
article h2{font-size:22px;color:var(--navy);margin:34px 0 10px;line-height:1.3}
article h3{font-size:18px;color:var(--navy);margin:24px 0 8px}
article p,article li{max-width:75ch}
article ul,article ol{padding-left:22px}
article li{margin:4px 0}
article li.sub{margin-left:20px;list-style:circle}
#body.editing{outline:2px dashed var(--red);outline-offset:10px;border-radius:2px}
.mg{display:flex;gap:2px;margin-left:6px}
.mg button{background:none;border:0;color:#9A9A9A;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px}
.mg button:hover{background:#262626;color:#fff}
nav .ghrow{display:flex;align-items:center}
nav .ghrow .gh{flex:1;min-width:0}
nav .ghrow .mg{margin-right:12px}
nav .items .row{display:flex;align-items:center}
nav .items .row a{flex:1;min-width:0}
nav .addp{display:block;width:100%;text-align:left;background:none;border:0;color:#8AB4F8;font-size:13.5px;padding:6px 22px 6px 34px;cursor:pointer}
nav .addc{display:block;width:calc(100% - 44px);margin:14px 22px;background:#141414;border:1px dashed #444;color:#8AB4F8;border-radius:6px;padding:8px;cursor:pointer;font-size:14px}
#tools{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#tools .lbl{font-size:12px;color:var(--slate);margin:0 4px 0 8px}
#tools .lbl:first-child{margin-left:0}
#tools button{background:var(--wash);border:1px solid var(--rule);border-radius:5px;padding:5px 9px;font-size:13px;cursor:pointer;color:var(--navy)}
#tools button:hover{background:#E8ECF1}
#tools button.danger{color:var(--red)}
#body .sel{outline:2px solid #8AB4F8;outline-offset:4px;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:16px 0}
.card{border:1px solid var(--rule);border-radius:8px;padding:16px 18px;background:#fff}
.card .ck{font-size:12px;color:var(--slate);margin-top:8px}
.card .cv{font-size:15px}
.card .cv.big{font-size:22px;font-weight:700;color:var(--navy)}
.card .cg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.note{border-left:3px solid var(--red);padding:4px 0 4px 14px;color:var(--slate);font-style:italic}
mark{background:var(--fill-bg);color:var(--red);font-weight:600;padding:0 3px;border-radius:3px}
.tw{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--wash);color:var(--navy);text-align:left;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top}
tbody tr:first-child td{border-top:0}

.docs{margin-top:40px;padding-top:6px;border-top:2px solid var(--navy)}
.docrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.docrow .n{font-weight:600;word-break:break-word}
.docrow .d{font-size:13px;color:var(--slate)}
.docrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--slate);padding:12px 0}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.filter select,.filter input{padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff}

.panel{border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin:18px 0}
.panel h3{margin-top:0}
.field{margin:10px 0}
.field label{display:block;font-size:14px;color:var(--slate);margin-bottom:4px}
.field input,.field select{width:100%;max-width:520px;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.status{font-size:14px;margin-top:10px;white-space:pre-line}
.status.err{color:var(--red)} .status.ok{color:var(--ok)}

#menuBtn{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:290px;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  #side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  #menuBtn{display:inline-block;margin-bottom:10px}
  .top{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 14px;flex-direction:column}
  .top h1{font-size:26px}
  article{padding:18px 18px 60px}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
@media print{#side,.top .tools,.docs .acts,#menuBtn{display:none}#app{display:block}article{max-width:none}}
</style>
</head>
<body>

<section id="login">
  <form class="loginbox" id="loginForm" autocomplete="off">
    <h1>Raj Kumar Handover</h1>
    <p class="sub">Prepared by Ajay Kawa · Confidential</p>
    <label for="user">User</label>
    <select id="user"></select>
    <label for="pw">Password</label>
    <input id="pw" type="password" required autocomplete="current-password">
    <button class="go" type="submit">Sign in</button>
    <div class="loginmsg" id="loginMsg" role="status"></div>
  </form>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><b>Raj Kumar Handover</b><span id="sideMeta"></span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="sidefoot"><button class="btn small" id="manageBtn" type="button">Manage menu</button><div id="whoami" style="margin-top:14px"></div><button class="btn small" id="outBtn" type="button">Sign out</button></div>
  </aside>
  <main>
    <div class="top">
      <div>
        <button class="btn quiet small" id="menuBtn" type="button" aria-controls="side">Sections</button>
        <h1 id="secTitle"></h1>
        <div class="meta" id="secMeta"></div>
      </div>
      <div class="tools">
        <button class="btn small hidden" id="editBtn" type="button">Edit this page</button>
        <button class="btn quiet small hidden" id="cancelBtn" type="button">Cancel</button>
        <button class="btn quiet small" type="button" onclick="window.print()">Print this page</button>
      </div>
    </div>
    <article id="view"></article>
  </main>
</div>

<script type="module">
/* =====================================================================
   SETTINGS – paste your Firebase web-app config here
   (Firebase console → Project settings → Your apps → Web app → Config)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCTxB6ra77vXbdaWuGPPEKWo2bdPB2HrPc",
  authDomain: "ajaykawa-32558.firebaseapp.com",
  projectId: "ajaykawa-32558",
  storageBucket: "ajaykawa-32558.firebasestorage.app",
  messagingSenderId: "675368452328",
  appId: "1:675368452328:web:5e5e1215b405496177095d"
};
/* The two people who can sign in. Emails must match the users created in
   Firebase Authentication and the list in the Firestore rules. */
const USERS = [
  { name: 'Ajay Kawa', email: 'aj@ykawa.com' },
  { name: 'Raj Kumar', email: 'raj@rajkumar.com' }
];
/* ===================================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, setPersistence, browserSessionPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, Bytes }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fmtSize = n => n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB';
const fmtDate = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
const today = () => new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const CHUNK = 900 * 1024;
const EXTRA_SECTIONS = [['other','Other documents']];

$('user').innerHTML = USERS.map(u => `<option value="${esc(u.email)}">${esc(u.name)}</option>`).join('');

const notConfigured = FIREBASE_CONFIG.apiKey.startsWith('PASTE');
if (notConfigured) $('loginMsg').textContent = 'This site is not connected to Firebase yet. Paste the Firebase config into index.html.';
const app = notConfigured ? null : initializeApp(FIREBASE_CONFIG);
const auth = app && getAuth(app);
const db = app && getFirestore(app);
if (auth) setPersistence(auth, browserSessionPersistence).catch(() => {});

const S = { me: null, meta: {}, sections: [], docs: [] };
let current = 'start';

function friendly(err){
  const c = err && err.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Password not recognised for this user.';
  if (c.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if (c.includes('network')) return 'No connection. Check your internet and try again.';
  if (c.includes('permission-denied')) return 'Signed in, but the Firestore rules are blocking this account. Publish the new rules in Firebase → Firestore Database → Rules.';
  if (c.includes('failed-precondition') || c.includes('not-found') || c.includes('unavailable')) return 'Signed in, but the Firestore database could not be reached. Check it has been created in Firebase → Firestore Database.';
  if (c.includes('operation-not-allowed')) return 'Email/Password sign-in is not switched on in Firebase → Authentication → Sign-in method.';
  if (c.includes('requires-recent-login')) return 'For security, sign out and back in, then change your password.';
  if (c.includes('weak-password')) return 'Choose a password of at least 6 characters.';
  return (err && err.message) || 'Something went wrong.';
}

/* ---------- sign in ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); if (!auth) return;
  const btn = $('loginForm').querySelector('button'); btn.disabled = true; $('loginMsg').textContent = 'Signing in…';
  try { await signInWithEmailAndPassword(auth, $('user').value, $('pw').value); $('pw').value = ''; }
  catch(err){ $('loginMsg').textContent = friendly(err) + ' (' + $('user').value + ' · ' + (err.code || 'error') + ')'; }
  btn.disabled = false;
};
$('outBtn').onclick = () => signOut(auth);
$('manageBtn').onclick = () => { S.manage = !S.manage; renderNav(); };
if (auth) onAuthStateChanged(auth, async user => {
  if (!user){ S.me = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('view').innerHTML = ''; return; }
  S.me = USERS.find(u => u.email.toLowerCase() === (user.email||'').toLowerCase()) || { name: user.email, email: user.email };
  $('loginMsg').textContent = 'Loading…';
  try { await loadAll(); $('loginMsg').textContent = ''; openApp(); }
  catch(err){ $('loginMsg').textContent = friendly(err) + ' (' + (user.email || '') + ' · ' + (err.code || 'error') + ')'; await signOut(auth); }
});

/* ---------- data ---------- */
async function loadAll(){
  const m = await getDoc(doc(db, 'meta', 'site')); S.meta = m.exists() ? m.data() : {};
  const sec = await getDocs(collection(db, 'sections'));
  S.sections = sec.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.order ?? 99) - (b.order ?? 99));
  const dd = await getDocs(collection(db, 'docs'));
  S.docs = dd.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function saveFile(name, type, bytes, section, note, progress){
  const ref = doc(collection(db, 'docs')); const n = Math.max(1, Math.ceil(bytes.length / CHUNK));
  for (let i = 0; i < n; i++){
    progress && progress(`Uploading ${name} – part ${i+1} of ${n}…`);
    await setDoc(doc(db, 'docs', ref.id, 'chunks', String(i).padStart(4,'0')), { d: Bytes.fromUint8Array(bytes.subarray(i*CHUNK, (i+1)*CHUNK)) });
  }
  const meta = { name, type: type || 'application/octet-stream', size: bytes.length, section, note: note || '', uploaded: new Date().toISOString(), by: S.me.name, chunks: n };
  await setDoc(ref, meta);  // written last, so half-finished uploads never appear in the list
  S.docs.push({ id: ref.id, ...meta });
}
async function readFile(d){
  const snap = await getDocs(collection(db, 'docs', d.id, 'chunks'));
  const parts = snap.docs.sort((a,b) => a.id.localeCompare(b.id)).map(x => x.data().d.toUint8Array());
  return new Blob(parts, { type: d.type });
}
async function removeFile(d){
  const snap = await getDocs(collection(db, 'docs', d.id, 'chunks'));
  for (const c of snap.docs) await deleteDoc(doc(db, 'docs', d.id, 'chunks', c.id));
  await deleteDoc(doc(db, 'docs', d.id));
  S.docs = S.docs.filter(x => x.id !== d.id);
}
async function importContent(data, msg, overwrite){
  if (!Array.isArray(data.sections)) throw new Error('That file is not a handover content file.');
  const deleted = new Set(overwrite ? [] : (S.meta.deleted || []));
  let skipped = 0;
  for (let i = 0; i < data.sections.length; i++){
    const s = data.sections[i]; msg(`Saving page ${i+1} of ${data.sections.length}…`);
    const ex = S.sections.find(x => x.id === s.id);
    if (!overwrite && (deleted.has(s.id) || (ex && ex.edited))){ skipped++; continue; }
    await setDoc(doc(db, 'sections', s.id), { title: s.title, group: s.group, order: s.order ?? i, html: s.html, custom: !!s.custom, edited: !!s.edited, updatedAt: new Date().toISOString(), updatedBy: S.me.name });
  }
  const keep = new Set(data.sections.map(x => x.id));
  for (const old of S.sections) if (!keep.has(old.id) && !old.custom && !old.edited) await deleteDoc(doc(db, 'sections', old.id));
  const metaUpd = { updated: data.updated || today(), preparedBy: data.preparedBy || 'Ajay Kawa', preparedFor: data.preparedFor || 'Raj Kumar' };
  if (overwrite){ metaUpd.deleted = []; if (data.groupOrder) metaUpd.groupOrder = data.groupOrder; }
  else if (data.groupOrder && !(S.meta.groupOrder || []).length) metaUpd.groupOrder = data.groupOrder;
  await setDoc(doc(db, 'meta', 'site'), metaUpd, { merge: true });
  S.lastSkipped = skipped;
  for (const a of (data.attachments || [])){
    const old = S.docs.find(d => d.name === a.name && d.section === a.section);
    if (old){ msg('Replacing ' + a.name + '…'); await removeFile(old); }
    await saveFile(a.name, a.type, unb64(a.data), a.section, 'Handover document', msg);
  }
  await loadAll();
}

/* ---------- layout ---------- */
function allSections(){ return [...S.sections, { id:'documents', title:'All documents', group:'Files' }, { id:'admin', title:'Upload & settings', group:'Files' }]; }
function fillCount(html){ return (String(html||'').match(/<mark>/g) || []).length; }
function openApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('sideMeta').textContent = S.meta.updated ? 'Updated ' + S.meta.updated : 'Confidential';
  $('whoami').textContent = 'Signed in as ' + S.me.name;
  renderNav();
  const want = location.hash.slice(1);
  go(S.sections.length ? (want || 'start') : 'admin');
}
const openGroups = new Set();
S.manage = false;
const FIXED = ['documents','admin'];
function groupList(){
  const names = [...new Set(S.sections.map(x => x.group || 'Other'))];
  const order = S.meta.groupOrder || [];
  names.sort((a,b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
  return names;
}
function renderNav(){
  const groups = {};
  for (const g of groupList()) groups[g] = [];
  for (const s of S.sections) groups[s.group || 'Other'].push(s);
  for (const g in groups) groups[g].sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
  groups['Files'] = [ ...(groups['Files'] || []), { id:'documents', title:'All documents', group:'Files' }, { id:'admin', title:'Upload & settings', group:'Files' } ];
  const M = S.manage;
  $('nav').innerHTML = Object.entries(groups).map(([g, items]) => {
    const total = items.reduce((n, s) => n + fillCount(s.html), 0); const open = M || openGroups.has(g);
    const gctl = M && g !== 'Files' ? `<span class="mg"><button data-gact="up" data-g="${esc(g)}" title="Move company up">▲</button><button data-gact="down" data-g="${esc(g)}" title="Move company down">▼</button><button data-gact="ren" data-g="${esc(g)}" title="Rename company">✎</button><button data-gact="del" data-g="${esc(g)}" title="Delete company">✕</button></span>` : '';
    return `<div class="grp"><div class="ghrow"><button class="gh" type="button" data-g="${esc(g)}" aria-expanded="${open}">${esc(g)}${!M && total ? `<span class="gc">${total}</span>` : ''}<span class="chev">▶</span></button>${gctl}</div>
      <div class="items${open ? '' : ' hidden'}">` + items.map(s => {
        const n = fillCount(s.html);
        const tag = s.id === 'documents' ? `<span class="cnt plain">${S.docs.length}</span>` : n ? `<span class="cnt" title="Items still to fill in">${n} to fill</span>` : '';
        const pctl = M && !FIXED.includes(s.id) ? `<span class="mg"><button data-pact="up" data-id="${s.id}" title="Move page up">▲</button><button data-pact="down" data-id="${s.id}" title="Move page down">▼</button><button data-pact="ren" data-id="${s.id}" title="Rename page">✎</button><button data-pact="del" data-id="${s.id}" title="Delete page">✕</button></span>` : '';
        return `<div class="row"><a href="#${s.id}" data-id="${s.id}"${s.id === current ? ' class="on"' : ''}>${esc(s.title)}${M ? '' : tag}</a>${pctl}</div>`;
      }).join('') + (M && g !== 'Files' ? `<button class="addp" data-addp="${esc(g)}" type="button">+ Add page</button>` : '') + '</div></div>';
  }).join('') + (M ? '<button class="addc" id="addCompany" type="button">+ Add company</button>' : '');
  $('nav').querySelectorAll('.gh').forEach(b => b.onclick = e => {

  });

  $('nav').querySelectorAll('[data-addp]').forEach(b => b.onclick = () => addPage(b.dataset.addp));
  if ($('addCompany')) $('addCompany').onclick = addCompany;
  $('manageBtn').textContent = M ? 'Done managing menu' : 'Manage menu';
}

/* ---------- menu management ---------- */
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'page';
async function saveSection(sec, fields){
  const upd = { ...fields, edited: true, updatedAt: new Date().toISOString(), updatedBy: S.me.name };
  await setDoc(doc(db, 'sections', sec.id), upd, { merge: true }); Object.assign(sec, upd);
}
async function saveGroupOrder(list){ await setDoc(doc(db, 'meta', 'site'), { groupOrder: list, updated: today() }, { merge: true }); S.meta.groupOrder = list; }
async function addPage(group, title){
  title = title || prompt('Name of the new page under ' + group + ':'); if (!title || !title.trim()) return;
  const inGroup = S.sections.filter(x => x.group === group);
  const order = inGroup.length ? Math.max(...inGroup.map(x => x.order ?? 0)) + 1 : 1000 + S.sections.length;
  const id = slug(group + '-' + title) + '-' + Date.now().toString(36);
  const page = { title: title.trim(), group, order, html: '<p>New page – click <strong>Edit this page</strong> to add content.</p>', custom: true, edited: true, updatedAt: new Date().toISOString(), updatedBy: S.me.name };
  try { await setDoc(doc(db, 'sections', id), page); S.sections.push({ id, ...page }); renderNav(); location.hash = id; }
  catch(err){ alert(friendly(err)); }
}
async function addCompany(){
  const g = prompt('Name of the new company or menu heading:'); if (!g || !g.trim()) return;
  if (groupList().includes(g.trim())) return alert('There is already a company called ' + g.trim() + '.');
  const first = prompt('Name of its first page (sub-menu item):', 'Overview'); if (!first || !first.trim()) return;
  const list = groupList(); list.push(g.trim()); await saveGroupOrder(list);
  await addPage(g.trim(), first);
}
async function pageAction(act, id){
  const sec = S.sections.find(x => x.id === id); if (!sec) return;
  try {
    if (act === 'ren'){
      const t = prompt('New name for this page:', sec.title); if (!t || !t.trim()) return;
      await saveSection(sec, { title: t.trim() });
    } else if (act === 'del'){
      const nd = S.docs.filter(d => d.section === id).length;
      if (!confirm('Delete the page “' + sec.title + '”?' + (nd ? ' Its ' + nd + ' document(s) will move to Other documents.' : '') + ' This cannot be undone.')) return;
      await deleteDoc(doc(db, 'sections', id));
      for (const d of S.docs.filter(d => d.section === id)){ await setDoc(doc(db, 'docs', d.id), { section: 'other' }, { merge: true }); d.section = 'other'; }
      const del = [...new Set([...(S.meta.deleted || []), id])];
      await setDoc(doc(db, 'meta', 'site'), { deleted: del, updated: today() }, { merge: true }); S.meta.deleted = del;
      S.sections = S.sections.filter(x => x.id !== id);
      if (current === id) location.hash = S.sections[0] ? S.sections[0].id : 'admin';
    } else {
      const list = S.sections.filter(x => x.group === sec.group).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
      const i = list.indexOf(sec), j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      // renumber the company's pages so the swap is always clean
      list.splice(i, 1); list.splice(j, 0, sec);
      const base = Math.min(...list.map(x => x.order ?? 0));
      for (let k = 0; k < list.length; k++) if (list[k].order !== base + k) await saveSection(list[k], { order: base + k });
    }
    renderNav();
  } catch(err){ alert(friendly(err)); }
}
async function companyAction(act, g){
  try {
    const pages = S.sections.filter(x => x.group === g);
    if (act === 'ren'){
      const n = prompt('New name for ' + g + ':', g); if (!n || !n.trim() || n.trim() === g) return;
      for (const p of pages) await saveSection(p, { group: n.trim() });
      await saveGroupOrder(groupList());
      if (openGroups.has(g)){ openGroups.delete(g); openGroups.add(n.trim()); }
    } else if (act === 'del'){
      if (!confirm('Delete the company “' + g + '” and all ' + pages.length + ' of its pages? Documents move to Other documents. This cannot be undone.')) return;
      const del = new Set(S.meta.deleted || []);
      for (const p of pages){
        await deleteDoc(doc(db, 'sections', p.id)); del.add(p.id);
        for (const d of S.docs.filter(d => d.section === p.id)){ await setDoc(doc(db, 'docs', d.id), { section: 'other' }, { merge: true }); d.section = 'other'; }
      }
      await setDoc(doc(db, 'meta', 'site'), { deleted: [...del], updated: today() }, { merge: true }); S.meta.deleted = [...del];
      S.sections = S.sections.filter(x => x.group !== g);
      await saveGroupOrder(groupList());
      if (!S.sections.some(x => x.id === current)) location.hash = S.sections[0] ? S.sections[0].id : 'admin';
    } else {
      const list = groupList(); const i = list.indexOf(g), j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]]; await saveGroupOrder(list);
    }
    renderNav();
  } catch(err){ alert(friendly(err)); }
}
window.addEventListener('hashchange', () => { if (S.me) go(location.hash.slice(1)); });
$('menuBtn').onclick = () => $('side').classList.toggle('open');
$('nav').addEventListener('click', e => { if (e.target.closest('a')) $('side').classList.remove('open'); });

function go(id){

/* ---------- editing ---------- */
let selBlock = null, selRow = null, selItem = null;
function topBlock(node){
  const body = $('body'); if (!body || !node) return null;
  while (node && node.parentNode !== body) node = node.parentNode;
  return node && node.parentNode === body ? node : null;
}
function trackSelection(){
  const body = $('body'); if (!body || body.contentEditable !== 'true') return;
  const sel = window.getSelection(); if (!sel.rangeCount) return;
  const n = sel.getRangeAt(0).startContainer; if (!body.contains(n)) return;
  const el = n.nodeType === 1 ? n : n.parentElement;
  const b = topBlock(el);
  if (selBlock && selBlock !== b) selBlock.classList.remove('sel');
  selBlock = b; if (b) b.classList.add('sel');
  selRow = el.closest('tr'); selItem = el.closest('li');
}
document.addEventListener('selectionchange', trackSelection);
function blockHTML(kind){
  switch(kind){
    case 'h2': return '<h2>New heading</h2>';
    case 'h3': return '<h3>New sub-heading</h3>';
    case 'p': return '<p>New paragraph</p>';
    case 'ul': return '<ul><li>First point</li><li>Second point</li></ul>';
    case 'table': return '<div class="tw"><table><thead><tr><th>Item</th><th>Detail</th></tr></thead><tbody><tr><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td></tr></tbody></table></div>';
    case 'note': return '<p class="note">Note</p>';
    case 'fill': return '<p><mark>[TO FILL]</mark></p>';
  }
}
function insertBlock(kind){
  const body = $('body'); const tmp = document.createElement('div'); tmp.innerHTML = blockHTML(kind);
  const el = tmp.firstElementChild;
  if (selBlock && selBlock.parentNode === body) selBlock.after(el); else body.appendChild(el);
  const target = el.querySelector('td,li') || el; const r = document.createRange(); r.selectNodeContents(target);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); el.scrollIntoView({ block: 'nearest' }); trackSelection();
}
function editAction(act){
  const body = $('body');
  if (act === 'delblock'){ if (!selBlock) return alert('Click into the part you want to delete first.'); const b = selBlock; selBlock = null; b.remove(); return; }
  if (act === 'delline'){
    if (selItem){ const l = selItem.parentElement; selItem.remove(); if (l && !l.querySelector('li')) (topBlock(l) || l).remove(); selItem = null; return; }
    if (selRow){ const t = selRow.closest('table'); if (selRow.parentElement.tagName === 'THEAD') return alert('That is the header row – use Delete block to remove the whole table.'); selRow.remove(); if (t && !t.querySelector('tbody tr')) (topBlock(t) || t).remove(); selRow = null; return; }
    return editAction('delblock');
  }
  if (act === 'addrow'){
    if (!selRow) return alert('Click into a table row first.');
    const r = selRow.parentElement.tagName === 'THEAD' ? selRow.closest('table').querySelector('tbody tr') : selRow;
    const nr = r.cloneNode(true); nr.querySelectorAll('td').forEach(td => td.textContent = '…'); r.after(nr); return;
  }
  if (act === 'additem'){
    if (!selItem) return alert('Click into a bullet point first.');
    const li = document.createElement('li'); li.textContent = 'New point'; selItem.after(li); return;
  }
  if (act === 'up' || act === 'down'){
    if (!selBlock) return alert('Click into the part you want to move first.');
    const sib = act === 'up' ? selBlock.previousElementSibling : selBlock.nextElementSibling;
    if (!sib) return; act === 'up' ? sib.before(selBlock) : sib.after(selBlock); selBlock.scrollIntoView({ block: 'nearest' }); return;
  }
  if (act === 'unfill'){ const m = window.getSelection().anchorNode; const mk = m && (m.nodeType === 1 ? m : m.parentElement).closest('mark'); if (mk) mk.replaceWith(...mk.childNodes); return; }
}
function showTools(on){
  const ex = $('tools'); if (ex) ex.remove(); if (!on) return;
  const t = document.createElement('div'); t.id = 'tools';
  t.innerHTML = `<span class="lbl">Add:</span>
    <button data-ins="h2">Heading</button><button data-ins="h3">Sub-heading</button><button data-ins="p">Paragraph</button>
    <button data-ins="ul">Bullet list</button><button data-ins="table">Table</button><button data-ins="note">Note</button><button data-ins="fill">Red “to fill” item</button>
    <span class="lbl">Selected part:</span>
    <button data-act="up">Move up</button><button data-act="down">Move down</button>
    <button data-act="addrow">+ Row</button><button data-act="additem">+ Bullet</button>
    <button data-act="delline" class="danger">Delete line / row</button><button data-act="delblock" class="danger">Delete block</button>`;
  t.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  t.querySelectorAll('[data-ins]').forEach(b => b.onclick = () => insertBlock(b.dataset.ins));

$('editBtn').onclick = async () => {
  const body = $('body'); if (!body) return;
  if (body.contentEditable !== 'true'){
    body.contentEditable = 'true'; body.classList.add('editing'); body.focus();

    $('editBtn').textContent = 'Save changes'; $('cancelBtn').classList.remove('hidden');
    $('secMeta').textContent = 'Editing – click into any part of the page, then use the toolbar to add, move or delete. Type over red items. Save when done; Cancel discards.';
    return;
  }
  body.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
  body.querySelectorAll('mark').forEach(m => { if (!/^\s*\[/.test(m.textContent)) m.replaceWith(...m.childNodes); });

    await saveSection(sec, { html: body.innerHTML });

    selBlock = selRow = selItem = null; go(current);
  } catch(err){ alert(friendly(err) + ' Your edits are still on screen – try saving again.'); $('editBtn').textContent = 'Save changes'; }
  $('editBtn').disabled = false;
};

/* ---------- documents ---------- */
function sectionTitle(id){ const s = allSections().find(x => x.id === id); return s ? s.title : (EXTRA_SECTIONS.find(x => x[0] === id) || [,id])[1]; }
function docRow(d, showSection){
  const canView = /pdf|image|text/.test(d.type);
  return `<div class="docrow"><div><div class="n">${esc(d.name)}</div><div class="d">${fmtSize(d.size)} · added ${fmtDate(d.uploaded)}${d.by ? ' by ' + esc(d.by) : ''}${showSection ? ' · ' + esc(sectionTitle(d.section)) : ''}${d.note ? ' · ' + esc(d.note) : ''}</div></div>

function docsBlock(sec){

function renderAllDocs(){

function bindDocButtons(){
  $('view').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const d = S.docs.find(x => x.id === b.dataset.id); if (!d) return;
    const label = b.textContent; b.disabled = true;

        b.textContent = 'Deleting…'; await removeFile(d); renderNav(); go(current); return;
      }

}

    const g = $('apG').value === '__new' ? $('apNew').value.trim() : $('apG').value; const t = $('apT').value.trim();
    if (!g || !t){ out.textContent = 'Enter a company and a page title.'; out.classList.add('err'); return; }
    const id = (g + '-' + t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '-' + Date.now().toString(36);
    const page = { title: t, group: g, order: 1000 + S.sections.length, html: '<p>New page – click <strong>Edit this page</strong> to add content.</p>', custom: true, updatedAt: new Date().toISOString(), updatedBy: S.me.name };
    try { await setDoc(doc(db, 'sections', id), page); S.sections.push({ id, ...page });
      const firstOfGroup = S.sections.find(x => x.group === g); if (firstOfGroup !== S.sections[S.sections.length-1]){ const i = S.sections.findIndex(x => x.id === id); const [p] = S.sections.splice(i,1); const last = S.sections.map(x => x.group).lastIndexOf(g); S.sections.splice(last+1, 0, p); }
      renderNav(); location.hash = id;
    } catch(err){ out.textContent = friendly(err); out.classList.add('err'); }
  };
  if (S.sections.some(s => s.id === current)) $('upSec').value = current;
  $('upBtn').onclick = async () => {
    const files = [...$('upFiles').files]; const out = $('upMsg'); out.className = 'status';
    if (!files.length){ out.textContent = 'Choose at least one file.'; out.classList.add('err'); return; }
    const big = files.find(f => f.size > 200 * 1048576); if (big){ out.textContent = big.name + ' is over 200 MB. Put it in the Google Drive folder instead.'; out.classList.add('err'); return; }
    $('upBtn').disabled = true;
    try {
      for (const f of files) await saveFile(f.name, f.type, new Uint8Array(await f.arrayBuffer()), $('upSec').value, $('upNote').value.trim(), t => out.textContent = t);
      out.textContent = `${files.length} file${files.length > 1 ? 's' : ''} uploaded to ${sectionTitle($('upSec').value)}.`; out.classList.add('ok');
      $('upFiles').value = ''; $('upNote').value = ''; renderNav();
    } catch(err){ out.textContent = friendly(err); out.classList.add('err'); }
    $('upBtn').disabled = false;
  };
  $('npBtn').onclick = async () => {
    const out = $('npMsg'); out.className = 'status'; const p = $('np').value;
    if (p.length < 6){ out.textContent = 'Use at least 6 characters.'; out.classList.add('err'); return; }
    try { await updatePassword(auth.currentUser, p); out.textContent = 'Password changed.'; out.classList.add('ok'); $('np').value = ''; }
    catch(err){ out.textContent = friendly(err); out.classList.add('err'); }
  };
}
</script>
</body>
